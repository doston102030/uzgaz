name: gaz_energiya
description: "Gaz & Energiya — O'zbekiston uchun energiya marketpleysi"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3

  # Supabase (backend integration)
  supabase_flutter: ^2.6.0
  flutter_dotenv: ^5.1.0

  # Maps & location
  google_maps_flutter: ^2.6.1
  geolocator: ^12.0.0
  geocoding: ^5.0.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # UI / UX
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  intl: ^0.20.2
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.1.2
  lottie: ^3.1.2
  image_picker: ^1.1.2

  # Utilities
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  uuid: ^4.4.0
  url_launcher: ^6.3.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - .env

  generate: true

flutter_intl:
  enabled: true
